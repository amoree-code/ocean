pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "packages/**/*.ts"
      run: pnpm typecheck
    privacy:
      run: pnpm check:privacy
    gitleaks:
      run: node scripts/gitleaks-staged.mjs
    skills:
      glob: "packages/harness/skills/**"
      run: pnpm check:skills

pre-push:
  commands:
    test:
      run: pnpm test
