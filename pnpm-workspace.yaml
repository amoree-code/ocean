packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  node-pty: true

# dependency-cruiser parses .ts through the TypeScript JS API, which typescript@7
# does not ship yet; give it its own 6.x without changing the build compiler.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# The Claude Agent SDK ships a Claude Code binary per platform as optional packages (~220 MB on
# darwin-arm64). Ocean always runs the user's installed `claude` through the SDK
# (pathToClaudeCodeExecutable), so the bundled binaries are never used.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
