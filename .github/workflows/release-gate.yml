name: Public Release Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: kernel
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:changelog
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm check:skills
      - run: pnpm check:privacy
      - run: pnpm check:template
      - run: pnpm check:tasks
      - run: pnpm check:deps
      - run: pnpm build
      - run: pnpm check:package
      - name: Run full test suite
        run: pnpm test

  linux-install:
    # T-308: the packed tarball on a clean Linux at the minimum Node, with no compiler toolchain.
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/pack-release.mjs --out release
      - run: sh scripts/linux-install-smoke.sh release/*.tgz

  docker:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: kernel
          file: kernel/Dockerfile
          push: false
